name: Keep Render Alive

on:
  schedule:
    # Запускать каждые 14 минут (интервал меньше 15 минут, чтобы Render не засыпал)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          echo "Pinging https://https://spectrum-bot-2wrk.onrender.com/health"
          curl -s -o /dev/null -w "%{http_code}\n" https://ВАШ_БОТ.onrender.com/health
